name: Release desktop app-images

# Builds a portable, self-contained app-image (bundled JRE + native launcher)
# per platform with jpackage and attaches the zips to the GitHub Release on a
# v* tag. workflow_dispatch builds the same artifacts without publishing, so
# the matrix is testable before a real tag. The per-platform build lives in the
# reusable _package-app-images.yml, shared with ci.yml.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (numeric; macOS requires a major >= 1, e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    uses: ./.github/workflows/_package-app-images.yml
    with:
      version: ${{ github.event.inputs.version || '1.0.0' }}
    secrets: inherit

  # Publish only on a tag, and from a single job so the three platform zips
  # land on one release without racing each other to create it.
  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all app-image zips
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
