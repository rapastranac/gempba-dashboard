name: Release desktop app-images

# Builds a portable, self-contained app-image (bundled JRE + native launcher)
# per platform with jpackage and attaches the zips to the GitHub Release on a
# v* tag. workflow_dispatch builds the same artifacts without publishing, so
# the matrix is testable before a real tag.
#
# Runner labels come from the RUNNER_* repo variables when set (the project's
# self-hosted fleet) and fall back to GitHub-hosted runners otherwise — the
# same idiom the gempba workflows use, so this survives the move to a public
# repo with no edits.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to stamp (numeric; macOS requires a major >= 1, e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: ${{ matrix.os }}
    runs-on: ${{ (matrix.os == 'linux' && fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]')) || (matrix.os == 'windows' && fromJSON(vars.RUNNER_WINDOWS || '["windows-2025"]')) || fromJSON(vars.RUNNER_MACOS || '["macos-26"]') }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ linux, windows, macos ]
    defaults:
      run:
        shell: bash
    steps:
      # Stale .git locks from a cancelled run break actions/checkout on
      # long-lived self-hosted macOS runners — same dance the gempba macOS
      # workflows do.
      - name: Clean stale .git locks
        if: runner.os == 'macOS'
        run: |
          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            find "$GITHUB_WORKSPACE/.git" -name '*.lock' -delete 2>/dev/null || true
          fi

      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.ref }}

      - name: Setup JDK 25
        uses: ./.github/actions/setup-java-jdk

      - name: Derive version and platform
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${{ github.event.inputs.version }}"
          fi
          case "$(uname -m)" in
            x86_64 | amd64) arch=x64 ;;
            arm64 | aarch64) arch=aarch64 ;;
            *) arch="$(uname -m)" ;;
          esac
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "PLATFORM=${{ matrix.os }}-$arch" >> "$GITHUB_ENV"

      - name: Build, test, and stamp version
        run: |
          mvn -B versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          mvn -B clean install

      - name: Stage runtime jars
        run: |
          mvn -B -pl app dependency:copy-dependencies \
            -DincludeScope=runtime -DoutputDirectory="$PWD/app/target/dist"
          cp "app/target/app-$VERSION.jar" app/target/dist/

      - name: Build platform icon
        run: |
          icons=app/src/main/resources/icons
          case "$RUNNER_OS" in
            Windows)
              python -m pip install --quiet pillow
              python packaging/make_ico.py "$icons/dashboard-256.png" icon.ico
              echo "ICON=$PWD/icon.ico" >> "$GITHUB_ENV"
              ;;
            macOS)
              mkdir -p icon.iconset
              cp "$icons/dashboard-16.png"  icon.iconset/icon_16x16.png
              cp "$icons/dashboard-32.png"  icon.iconset/icon_16x16@2x.png
              cp "$icons/dashboard-32.png"  icon.iconset/icon_32x32.png
              cp "$icons/dashboard-64.png"  icon.iconset/icon_32x32@2x.png
              cp "$icons/dashboard-128.png" icon.iconset/icon_128x128.png
              cp "$icons/dashboard-256.png" icon.iconset/icon_128x128@2x.png
              cp "$icons/dashboard-256.png" icon.iconset/icon_256x256.png
              iconutil -c icns icon.iconset -o icon.icns
              echo "ICON=$PWD/icon.icns" >> "$GITHUB_ENV"
              ;;
            Linux)
              echo "ICON=$PWD/$icons/dashboard-256.png" >> "$GITHUB_ENV"
              ;;
          esac

      - name: Build app-image
        run: |
          args=()
          # SWT's Cocoa backend must own the first thread or the app crashes on launch.
          [ "$RUNNER_OS" = "macOS" ] && args+=(--java-options -XstartOnFirstThread)
          [ -n "${ICON:-}" ] && [ -f "$ICON" ] && args+=(--icon "$ICON")
          jpackage --type app-image \
            --name gempba-dashboard \
            --app-version "$VERSION" \
            --input app/target/dist \
            --main-jar "app-$VERSION.jar" \
            --main-class io.gempba.dashboard.Main \
            --dest app/target/jpkg \
            "${args[@]}"

      - name: Zip the app-image
        run: |
          asset="gempba-dashboard-$VERSION-$PLATFORM.zip"
          cd app/target/jpkg
          case "$RUNNER_OS" in
            macOS)   ditto -c -k --keepParent "gempba-dashboard.app" "$GITHUB_WORKSPACE/$asset" ;;
            Windows) 7z a -tzip "$GITHUB_WORKSPACE/$asset" "gempba-dashboard" > /dev/null ;;
            Linux)   zip -qry "$GITHUB_WORKSPACE/$asset" "gempba-dashboard" ;;
          esac
          echo "ASSET=$asset" >> "$GITHUB_ENV"

      - name: Upload build artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.PLATFORM }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  # Publish only on a tag, and from a single job so the three platform zips
  # land on one release without racing each other to create it.
  release:
    needs: package
    if: github.ref_type == 'tag'
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download all app-image zips
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Attach to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
