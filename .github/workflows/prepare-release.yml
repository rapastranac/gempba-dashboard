name: Prepare release

# Manually triggered: opens a release-prep PR against main, or the base branch given, for version X.Y.Z. It sets every
# package to the version (configs/set-version.js), refreshes the lockfile, drafts the release notes from git log, and
# opens the PR. After curating the notes and merging, push the vX.Y.Z tag: release.yml builds the installers and opens
# a draft release with the notes, to publish by hand after a look.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Target version (e.g. 2.1.0; no leading v)'
        required: true
        type: string
      base_branch:
        description: 'Branch to release from and open the prep PR against (another branch tries the flow out)'
        required: false
        type: string
        default: main

permissions:
  contents: write
  pull-requests: write

jobs:
  prepare:
    runs-on: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
    timeout-minutes: 15
    env:
      BASE: ${{ inputs.base_branch || 'main' }}
    steps:
      - name: Validate version
        run: |
          set -euo pipefail
          V='${{ inputs.version }}'
          if ! [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z (got '$V')"
            exit 1
          fi
          {
            echo "VERSION=$V"
            echo "TAG=v$V"
            echo "BRANCH=prep/v$V"
          } >> "$GITHUB_ENV"

      - name: Checkout the base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BASE }}
          fetch-depth: 0  # full history, so the notes see the previous tag

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # electron-updater never offers a lower version, so a release must go higher than every one before it.
      - name: Refuse a version not higher than the latest v* tag, or an existing prep branch
        run: |
          set -euo pipefail
          latest=$(git ls-remote --tags --refs origin 'v*' \
            | sed -n 's|.*refs/tags/\(v[0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)$|\1|p' | sort -V | tail -1)
          highest=$(printf '%s\n' "$latest" "$TAG" | sort -V | tail -1)
          if [ "$TAG" = "$latest" ] || [ "$TAG" != "$highest" ]; then
            echo "::error::version $VERSION is not higher than the latest tag, $latest"
            exit 1
          fi
          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            echo "::error::branch $BRANCH already exists on origin"
            exit 1
          fi

      - name: Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create the prep branch
        run: git switch -c "$BRANCH"

      - name: Set every package to the version
        run: |
          set -euo pipefail
          node configs/set-version.js "$VERSION"
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Draft the release notes
        run: |
          set -euo pipefail
          NOTES_DIR=docs/releases
          NOTES="${NOTES_DIR}/release-notes-v${VERSION}.md"
          mkdir -p "$NOTES_DIR"
          if [ -f "$NOTES" ]; then
            echo "::notice::$NOTES already exists; leaving it in place"
            exit 0
          fi
          LAST_TAG=$(git tag -l 'v*' --sort=-v:refname | head -1 || true)
          if [ -z "$LAST_TAG" ]; then
            RANGE=""
            SINCE="initial release"
          else
            RANGE="${LAST_TAG}..HEAD"
            SINCE="$LAST_TAG"
          fi
          DATE=$(date -u +%Y-%m-%d)
          TAG_URL="https://github.com/${{ github.repository }}/releases/tag/${TAG}"
          {
            printf '%s\n\n' "# v${VERSION}"
            printf '%s\n\n' "<small>${DATE} · [tag](${TAG_URL})</small>"
            printf '%s\n\n' "<!-- TODO: one-line tagline -->"
            printf '%s\n\n' "## Changed"
            if [ -n "$RANGE" ]; then
              git log --no-merges --pretty='- %s' -n 200 "$RANGE"
            fi
            printf '\n%s\n' "<!-- TODO: curate — drop CI / internal items, rewrite for end-users; add Added / Fixed / Removed sections as needed. -->"
          } > "$NOTES"
          echo "wrote $NOTES (since ${SINCE})"

      - name: Commit
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo "::error::nothing staged — the version bump and notes produced no diff"
            exit 1
          fi
          git commit -m "$(printf '%s\n\n%s\n%s' \
            "Prep release ${TAG}" \
            "- Set every package and the lockfile to ${VERSION}" \
            "- Add docs/releases/release-notes-v${VERSION}.md draft (curate before merging)")"

      - name: Push the prep branch
        run: git push -u origin "$BRANCH"

      - name: Open the prep PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BODY=$(mktemp)
          printf '%s\n' \
            "Auto-opened by the prepare-release workflow." \
            "" \
            "**Changes**" \
            "" \
            "- Every package, the @gempba dependencies between them and the lockfile set to \`${VERSION}\` (\`configs/set-version.js\`)." \
            "- Release-notes draft at \`docs/releases/release-notes-v${VERSION}.md\`, generated from \`git log\` — **curate before merging** (drop CI / internal items, write for end-users)." \
            "" \
            "**Operator checklist**" \
            "" \
            "- [ ] Curate \`docs/releases/release-notes-v${VERSION}.md\`; it becomes the release's description." \
            "- [ ] Confirm CI is green on this branch." \
            "- [ ] Merge to \`${BASE}\`." \
            "- [ ] Push the \`${TAG}\` tag — release.yml builds and boots the installers and opens a draft release with them and the notes." \
            "- [ ] Look over the draft's notes and files, then publish it: every installed app is offered it at once." \
            > "$BODY"
          gh pr create --base "$BASE" --head "$BRANCH" --title "Prep release ${TAG}" --label Release --body-file "$BODY"
