name: CI

on:
  push:
    branches:
      - main
      - 20-re-platform-to-theia-electron
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ${{ fromJSON(vars.RUNNER_LINUX || '["ubuntu-24.04"]') }}
          - os: windows
            runner: ${{ fromJSON(vars.RUNNER_WINDOWS || '["windows-2025"]') }}
          - os: macos
            runner: ${{ fromJSON(vars.RUNNER_MACOS_ARM || '["macos-26"]') }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup-node-theia
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
