name: CI

on:
  push:
    branches:
      - main
      - 20-re-platform-to-theia-electron
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ${{ vars.RUNNER_LINUX || 'ubuntu-24.04' }}
          - os: windows
            runner: ${{ vars.RUNNER_WINDOWS || 'windows-2025' }}
          - os: macos
            runner: ${{ vars.RUNNER_MACOS || 'macos-26' }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install Linux build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
      - name: Install
        run: npm ci
      - name: Compile
        run: npm run compile
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
