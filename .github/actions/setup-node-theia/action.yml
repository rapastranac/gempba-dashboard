name: Set up Node for Theia
description: Node 22 with the npm cache, the native build prerequisites on Linux, and a clean install.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
        cache: npm
    - name: Install Linux build prerequisites
      if: runner.os == 'Linux'
      shell: bash
      run: sudo apt-get update && sudo apt-get install -y libx11-dev libxkbfile-dev libsecret-1-dev
    - name: Install
      shell: bash
      run: npm ci
    - name: Check the dependency tree
      shell: bash
      run: npm ls --all > /dev/null
