<svg xmlns="http://www.w3.org/2000/svg" width="900" height="400" viewBox="0 0 900 400" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="JUMP next to ProxyJump: with ProxyJump this machine signs in to the compute node, which refuses it; JUMP signs in to the login node, which runs the hop to the compute node with the cluster's own trust">
<title>JUMP next to ProxyJump: with ProxyJump this machine signs in to the compute node, which refuses it; JUMP signs in to the login node, which runs the hop to the compute node with the cluster's own trust</title>
<defs><marker id="head-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker><marker id="tail-59636e" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#59636e"/></marker><marker id="head-d0d7de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d0d7de"/></marker><marker id="tail-d0d7de" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#d0d7de"/></marker><marker id="head-1a7f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f80"/></marker><marker id="tail-1a7f80" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1a7f80"/></marker><marker id="head-2f8a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f8a3a"/></marker><marker id="tail-2f8a3a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2f8a3a"/></marker><marker id="head-9a6700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker><marker id="tail-9a6700" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#9a6700"/></marker><marker id="head-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker><marker id="tail-8250df" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8250df"/></marker><marker id="head-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="tail-0969da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0969da"/></marker><marker id="head-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="tail-1a7f37" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1a7f37"/></marker><marker id="head-818b98" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#818b98"/></marker><marker id="tail-818b98" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#818b98"/></marker><marker id="head-cf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="tail-cf222e" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#cf222e"/></marker></defs>
<rect width="900" height="400" fill="#ffffff"/>
<rect x="20" y="20" width="860" height="170" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><text x="34" y="40" font-size="12" font-weight="600" fill="#59636e" letter-spacing="0.06em">PROXYJUMP (SSH -J): REFUSED</text>
<rect x="20" y="210" width="860" height="170" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><text x="34" y="230" font-size="12" font-weight="600" fill="#59636e" letter-spacing="0.06em">JUMP: THE HOP RUNS ON THE LOGIN NODE</text>
<rect x="40" y="80" width="170" height="60" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="125" y="115" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">your machine</text>
<rect x="360" y="80" width="170" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="445" y="106.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">login node</text><text x="445" y="124.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">relays TCP only</text>
<rect x="680" y="80" width="180" height="60" rx="8" fill="#ffebe9" stroke="#cf222e" stroke-width="1.5"/><text x="770" y="106.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">compute node</text><text x="770" y="124.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">trusts login nodes only</text>
<path d="M210 110 L360 110" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<path d="M530 110 L680 110" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="270.1" y="90" width="29.799999999999997" height="16" fill="#ffffff"/><text x="285" y="102" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">TCP</text>
<rect x="590.1" y="90" width="29.799999999999997" height="16" fill="#ffffff"/><text x="605" y="102" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">TCP</text>
<path d="M125 140 L125 170 L770 170 L770 140" fill="none" stroke="#cf222e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#head-cf222e)"/>
<rect x="204.10000000000002" y="162" width="491.79999999999995" height="16" fill="#ffffff"/><text x="450" y="174" font-size="12" font-weight="400" fill="#cf222e" text-anchor="middle">SSH handshake: your key is refused, it asks for a password you don't have</text>
<rect x="40" y="270" width="170" height="60" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="125" y="296.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">your machine</text><text x="125" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the dashboard</text>
<rect x="360" y="270" width="170" height="60" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="445" y="296.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">login node</text><text x="445" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">runs <tspan font-family="ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', monospace">ssh -N -L</tspan> on a PTY</text>
<rect x="680" y="270" width="180" height="60" rx="8" fill="#e7f6ea" stroke="#1a7f37" stroke-width="1.5"/><text x="770" y="296.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">compute node</text><text x="770" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">gempba rank 0</text>
<path d="M210 300 L360 300" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="233.8" y="280" width="102.39999999999999" height="16" fill="#ffffff"/><text x="285" y="292" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">SSH: keys, MFA</text>
<rect x="243.7" y="310" width="82.6" height="16" fill="#ffffff"/><text x="285" y="322" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">one sign-in</text>
<path d="M530 300 L680 300" fill="none" stroke="#1a7f37" stroke-width="1.6" marker-end="url(#head-1a7f37)"/>
<rect x="557.1" y="280" width="95.8" height="16" fill="#ffffff"/><text x="605" y="292" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">the cluster's</text>
<rect x="570.3" y="310" width="69.4" height="16" fill="#ffffff"/><text x="605" y="322" font-size="12" font-weight="400" fill="#1a7f37" text-anchor="middle">own trust</text>
<rect x="138.10000000000002" y="350" width="623.8" height="16" fill="#ffffff"/><text x="450" y="362" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Closing the channel hangs the hop up; the forward carries gempba's port back to your machine.</text>
</svg>
