<rect x="260" y="20" width="180" height="56" rx="8" fill="#eaf5ea" stroke="#2f8a3a" stroke-width="1.5"/><text x="350" y="44.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/auth</text><text x="350" y="62.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">adds HOST, JUMP</text>
