<rect x="260" y="180" width="180" height="56" rx="8" fill="#eaf5ea" stroke="#2f8a3a" stroke-width="1.5"/><text x="350" y="204.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/grid</text><text x="350" y="222.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">one tile per node</text>
<rect x="260" y="260" width="180" height="56" rx="8" fill="#eaf5ea" stroke="#2f8a3a" stroke-width="1.5"/><text x="350" y="284.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/cards</text><text x="350" y="302.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">tree and details</text>
<rect x="260" y="340" width="180" height="56" rx="8" fill="#eaf5ea" stroke="#2f8a3a" stroke-width="1.5" stroke-dasharray="6 4"/><text x="350" y="364.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/mock</text><text x="350" y="382.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">built-in mocker</text>
<rect x="520" y="20" width="170" height="376" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="605" y="170.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/telemetry</text><text x="605" y="188.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the hub:</text><text x="605" y="204.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">TelemetryService,</text><text x="605" y="220.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">commands,</text><text x="605" y="236.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">live controls,</text><text x="605" y="252.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">TunnelProvider</text>
<rect x="740" y="154" width="140" height="108" rx="8" fill="#fbf3dc" stroke="#9a6700" stroke-width="1.5"/><text x="810" y="187.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/core</text><text x="810" y="205.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">read-model,</text><text x="810" y="221.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">no Theia; features</text><text x="810" y="237.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">use its types too</text>
<rect x="20" y="100" width="160" height="216" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/><text x="100" y="179" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">@gempba/ui</text><text x="100" y="197" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the UI kit:</text><text x="100" y="213" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">tiles, charts,</text><text x="100" y="229" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">gauges, panels,</text><text x="100" y="245" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">theme colors</text>
