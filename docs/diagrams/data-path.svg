<rect x="40" y="240" width="190" height="90" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="135" y="264.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">TelemetryClient</text><text x="135" y="282.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">TCP, one JSON line</text><text x="135" y="298.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">at a time; retries</text><text x="135" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">on its own</text>
<rect x="250" y="240" width="190" height="90" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="345" y="264.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">TelemetryStore</text><text x="345" y="282.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">last topology; a paused</text><text x="345" y="298.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">line's header; a new</text><text x="345" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">run starts afresh</text>
<rect x="460" y="240" width="190" height="90" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="555" y="264.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">WorldSnapshotMapper</text><text x="555" y="282.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">wire keys to the</text><text x="555" y="298.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">read-model, the</text><text x="555" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">only place that does</text>
<rect x="670" y="240" width="190" height="90" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="765" y="264.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">TelemetryServer</text><text x="765" y="282.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the link and why it</text><text x="765" y="298.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">stopped; sends the</text><text x="765" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">controls back</text>
<rect x="40" y="410" width="190" height="90" rx="8" fill="#eaf5ea" stroke="#2f8a3a" stroke-width="1.5"/><text x="135" y="434.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Connection view</text><text x="135" y="452.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">and the commands:</text><text x="135" y="468.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Listen, rate, Pause,</text><text x="135" y="484.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Snapshot, Mark…</text>
<rect x="250" y="410" width="190" height="90" rx="8" fill="#eaf5ea" stroke="#2f8a3a" stroke-width="1.5"/><text x="345" y="443" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Views</text><text x="345" y="461" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Grid, Cards,</text><text x="345" y="477" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">status bar</text>
<rect x="460" y="410" width="190" height="90" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="555" y="434.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">History stores</text><text x="555" y="452.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">rates, totals, CPU,</text><text x="555" y="468.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">memory per rank</text><text x="555" y="484.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">and per node</text>
<rect x="670" y="410" width="190" height="90" rx="8" fill="#e3f4f4" stroke="#1a7f80" stroke-width="1.5"/><text x="765" y="434.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">TelemetryService</text><text x="765" y="452.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">condition, Clear,</text><text x="765" y="468.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">refresh rate,</text><text x="765" y="484.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">run controls</text>
