<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="470" viewBox="0 0 1020 470" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="The stream's conditions: no data until a run's first frame; live, paused, reconnecting and ended while listening; stopped, disconnected and lost once not; Clear or a new Listen empties the views">
<title>The stream's conditions: no data until a run's first frame; live, paused, reconnecting and ended while listening; stopped, disconnected and lost once not; Clear or a new Listen empties the views</title>
<defs><marker id="head-59636e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#59636e"/></marker><marker id="tail-59636e" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#59636e"/></marker><marker id="head-d0d7de" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#d0d7de"/></marker><marker id="tail-d0d7de" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#d0d7de"/></marker><marker id="head-1a7f80" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f80"/></marker><marker id="tail-1a7f80" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1a7f80"/></marker><marker id="head-2f8a3a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#2f8a3a"/></marker><marker id="tail-2f8a3a" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#2f8a3a"/></marker><marker id="head-9a6700" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#9a6700"/></marker><marker id="tail-9a6700" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#9a6700"/></marker><marker id="head-8250df" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#8250df"/></marker><marker id="tail-8250df" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#8250df"/></marker><marker id="head-0969da" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#0969da"/></marker><marker id="tail-0969da" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#0969da"/></marker><marker id="head-1a7f37" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#1a7f37"/></marker><marker id="tail-1a7f37" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#1a7f37"/></marker><marker id="head-818b98" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#818b98"/></marker><marker id="tail-818b98" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#818b98"/></marker><marker id="head-cf222e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#cf222e"/></marker><marker id="tail-cf222e" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10 0 L0 5 L10 10 z" fill="#cf222e"/></marker></defs>
<rect width="1020" height="470" fill="#ffffff"/>
<rect x="200" y="20" width="470" height="330" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><text x="214" y="40" font-size="12" font-weight="600" fill="#59636e" letter-spacing="0.06em">LISTENING</text>
<rect x="800" y="20" width="200" height="330" rx="12" fill="none" stroke="#d0d7de" stroke-width="1.5" stroke-dasharray="4 4"/><text x="814" y="40" font-size="12" font-weight="600" fill="#59636e" letter-spacing="0.06em">NOT LISTENING</text>
<rect x="20" y="160" width="140" height="60" rx="8" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/><text x="90" y="186.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">No data</text><text x="90" y="204.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">empty views</text>
<rect x="260" y="160" width="140" height="60" rx="8" fill="#e7f6ea" stroke="#1a7f37" stroke-width="1.5"/><text x="330" y="186.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Live</text><text x="330" y="204.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">frames arrive</text>
<rect x="260" y="50" width="140" height="60" rx="8" fill="#f3edfb" stroke="#8250df" stroke-width="1.5"/><text x="330" y="76.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Paused</text><text x="330" y="94.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">header-only lines</text>
<rect x="260" y="270" width="140" height="60" rx="8" fill="#fbf3dc" stroke="#9a6700" stroke-width="1.5"/><text x="330" y="296.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Reconnecting</text><text x="330" y="314.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the client retries</text>
<rect x="500" y="160" width="150" height="60" rx="8" fill="#eff1f3" stroke="#59636e" stroke-width="1.5"/><text x="575" y="186.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Run ended</text><text x="575" y="204.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the run's final line</text>
<rect x="820" y="60" width="160" height="60" rx="8" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/><text x="900" y="86.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Stopped</text><text x="900" y="104.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">you stopped listening</text>
<rect x="820" y="160" width="160" height="60" rx="8" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/><text x="900" y="186.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Disconnected</text><text x="900" y="204.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">you disconnected</text>
<rect x="820" y="260" width="160" height="60" rx="8" fill="#f6f8fa" stroke="#818b98" stroke-width="1.5"/><text x="900" y="286.5" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Connection lost</text><text x="900" y="304.5" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">the SSH session closed</text>
<path d="M160 190 L260 190" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="168.7" y="170" width="82.6" height="16" fill="#ffffff"/><text x="210" y="182" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">first frame</text>
<path d="M310 160 L310 110" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="264" y="128" width="43" height="16" fill="#ffffff"/><text x="302" y="140" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">Pause</text>
<path d="M350 110 L350 160" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="353" y="128" width="49.599999999999994" height="16" fill="#ffffff"/><text x="358" y="140" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">Resume</text>
<path d="M310 220 L310 270" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="231" y="238" width="76" height="16" fill="#ffffff"/><text x="302" y="250" font-size="12" font-weight="400" fill="#59636e" text-anchor="end">link drops</text>
<path d="M350 270 L350 220" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="353" y="238" width="69.4" height="16" fill="#ffffff"/><text x="358" y="250" font-size="12" font-weight="400" fill="#59636e" text-anchor="start">link back</text>
<path d="M400 180 L500 180" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="412" y="160" width="76" height="16" fill="#ffffff"/><text x="450" y="172" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">final line</text>
<path d="M500 205 L400 205" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="418.6" y="213" width="62.8" height="16" fill="#ffffff"/><text x="450" y="225" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">next run</text>
<path d="M670 90 L820 90" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="716.8" y="70" width="36.4" height="16" fill="#ffffff"/><text x="735" y="82" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Stop</text>
<path d="M670 190 L820 190" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="697" y="170" width="76" height="16" fill="#ffffff"/><text x="735" y="182" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Disconnect</text>
<path d="M670 290 L820 290" fill="none" stroke="#59636e" stroke-width="1.6" marker-end="url(#head-59636e)"/>
<rect x="683.8" y="270" width="102.39999999999999" height="16" fill="#ffffff"/><text x="735" y="282" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">session closes</text>
<path d="M900 350 L900 420 L90 420 L90 220" fill="none" stroke="#59636e" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#head-59636e)"/>
<rect x="361.3" y="400" width="267.4" height="16" fill="#ffffff"/><text x="495" y="412" font-size="12" font-weight="400" fill="#59636e" text-anchor="middle">Clear, or a new Listen: the views empty</text>
<rect x="168.40000000000003" y="440" width="683.1999999999999" height="16" fill="#ffffff"/><text x="510" y="452" font-size="12" font-weight="400" fill="#1f2328" text-anchor="middle">Every condition but Live and Paused is frozen data: kept as it was, dimmed, under a bar that says why.</text>
</svg>
